<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Core Domains and Expertise</title>
  <desc id="desc">Glass-like cards showing main domains of expertise.</desc>
  <defs>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3F43"/>
      <stop offset="100%" stop-color="#1A5C60"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="260" fill="#020617"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="14">
    <!-- Cybersecurity & Risk -->
    <g>
      <rect x="60" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="90" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Cybersecurity</text>
      <text x="90" y="100" fill="#9CA3AF">Risk modeling</text>
      <text x="90" y="120" fill="#9CA3AF">Exposure control</text>
      <text x="90" y="140" fill="#9CA3AF">Identity architecture</text>
      <text x="90" y="160" fill="#9CA3AF">Boundary design</text>
    </g>

    <!-- Architecture & Infrastructure -->
    <g>
      <rect x="290" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#4ADE80" stroke-opacity="0.35"/>
      <text x="320" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Architecture</text>
      <text x="320" y="100" fill="#9CA3AF">Cloud foundations</text>
      <text x="320" y="120" fill="#9CA3AF">Modular systems</text>
      <text x="320" y="140" fill="#9CA3AF">Network boundaries</text>
      <text x="320" y="160" fill="#9CA3AF">Resilience engineering</text>
    </g>

    <!-- Automation & Reliability -->
    <g>
      <rect x="520" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FACC15" stroke-opacity="0.35"/>
      <text x="550" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Automation</text>
      <text x="550" y="100" fill="#9CA3AF">Ansible orchestration</text>
      <text x="550" y="120" fill="#9CA3AF">CI/CD workflows</text>
      <text x="550" y="140" fill="#9CA3AF">Reproducible infra</text>
      <text x="550" y="160" fill="#9CA3AF">Lifecycle thinking</text>
    </g>

    <!-- Systems & Ops -->
    <g>
      <rect x="750" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#A855F7" stroke-opacity="0.35"/>
      <text x="780" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Systems &amp; Ops</text>
      <text x="780" y="100" fill="#9CA3AF">Linux</text>
      <text x="780" y="120" fill="#9CA3AF">Virtualization</text>
      <text x="780" y="140" fill="#9CA3AF">Proxmox homelab</text>
      <text x="780" y="160" fill="#9CA3AF">Secure hosting</text>
    </g>
  </g>
</svg>
