<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Core Domains and Strengths</title>
  <desc id="desc">Glass-like cards showing main domains of expertise.</desc>
  <defs>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3F43"/>
      <stop offset="100%" stop-color="#1A5C60"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="260" fill="#020617"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="14">
    <!-- Systems & Infrastructure -->
    <g>
      <rect x="60" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="90" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Systems &amp; Infra</text>
      <text x="90" y="100" fill="#9CA3AF">Proxmox VE</text>
      <text x="90" y="120" fill="#9CA3AF">Debian / Linux</text>
      <text x="90" y="140" fill="#9CA3AF">LXC / VMs</text>
      <text x="90" y="160" fill="#9CA3AF">Service lifecycle</text>
    </g>

    <!-- Homelab Architecture -->
    <g>
      <rect x="290" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#4ADE80" stroke-opacity="0.35"/>
      <text x="320" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Homelab Design</text>
      <text x="320" y="100" fill="#9CA3AF">Private cloud patterns</text>
      <text x="320" y="120" fill="#9CA3AF">Service mapping</text>
      <text x="320" y="140" fill="#9CA3AF">Rebuild thinking</text>
      <text x="320" y="160" fill="#9CA3AF">Documentation</text>
    </g>

    <!-- Security & Access -->
    <g>
      <rect x="520" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FACC15" stroke-opacity="0.35"/>
      <text x="550" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Security &amp; Access</text>
      <text x="550" y="100" fill="#9CA3AF">WireGuard</text>
      <text x="550" y="120" fill="#9CA3AF">Cloudflare Tunnel</text>
      <text x="550" y="140" fill="#9CA3AF">Minimal exposure</text>
      <text x="550" y="160" fill="#9CA3AF">DNS &amp; encryption</text>
    </g>

    <!-- Services & Data -->
    <g>
      <rect x="750" y="40" width="200" height="180" rx="18" ry="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#A855F7" stroke-opacity="0.35"/>
      <text x="780" y="75" fill="#E5E7EB" font-size="16" font-weight="600">Services &amp; Data</text>
      <text x="780" y="100" fill="#9CA3AF">Nextcloud</text>
      <text x="780" y="120" fill="#9CA3AF">Proxmox Backup Server</text>
      <text x="780" y="140" fill="#9CA3AF">AdGuard</text>
      <text x="780" y="160" fill="#9CA3AF">Backups &amp; recovery</text>
    </g>
  </g>
</svg>
