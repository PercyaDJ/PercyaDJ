<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 228" role="img" aria-label="PatchBoard. Open source · a single file. Every week, security teams receive dozens of files listing which computers are out of date. PatchBoard takes them all in at once, shows the machines to fix and drafts the emails to warn the right people."><title>PatchBoard. Open source · a single file. Every week, security teams receive dozens of files listing which computers are out of date. PatchBoard takes them all in at once, shows the machines to fix and drafts the emails to warn the right people.</title><style>@font-face{font-family:'Sora';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style><text x="0" y="26" font-family="Sora" font-size="22" font-weight="700" fill="#1f2328">PatchBoard</text><text x="0" y="50" font-family="JetBrains Mono" font-size="12.5" font-weight="400" fill="#59636e">Open source · a single file</text><text x="0" y="84" font-family="Sora" font-size="15" font-weight="300" fill="#1f2328">Every week, security teams receive</text><text x="0" y="109" font-family="Sora" font-size="15" font-weight="300" fill="#1f2328">dozens of files listing which computers</text><text x="0" y="134" font-family="Sora" font-size="15" font-weight="300" fill="#1f2328">are out of date. PatchBoard takes them</text><text x="0" y="159" font-family="Sora" font-size="15" font-weight="300" fill="#1f2328">all in at once, shows the machines to</text><text x="0" y="184" font-family="Sora" font-size="15" font-weight="300" fill="#1f2328">fix and drafts the emails to warn the</text><text x="0" y="209" font-family="Sora" font-size="15" font-weight="300" fill="#1f2328">right people.</text></svg>