<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 203" role="img" aria-label="Lowsper. Code ouvert · dans le navigateur. Pendant une réunion, Lowsper écrit tout ce qui se dit et sépare qui parle. J&#x27;en ressors avec de quoi faire le compte rendu en deux minutes. Rien ne part sur internet : tout reste sur l&#x27;ordinateur."><title>Lowsper. Code ouvert · dans le navigateur. Pendant une réunion, Lowsper écrit tout ce qui se dit et sépare qui parle. J&#x27;en ressors avec de quoi faire le compte rendu en deux minutes. Rien ne part sur internet : tout reste sur l&#x27;ordinateur.</title><style>@font-face{font-family:'Sora';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style><text x="0" y="26" font-family="Sora" font-size="22" font-weight="700" fill="#e6edf3">Lowsper</text><text x="0" y="50" font-family="JetBrains Mono" font-size="12.5" font-weight="400" fill="#9198a1">Code ouvert · dans le navigateur</text><text x="0" y="84" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">Pendant une réunion, Lowsper écrit tout</text><text x="0" y="109" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">ce qui se dit et sépare qui parle. J&#x27;en</text><text x="0" y="134" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">ressors avec de quoi faire le compte</text><text x="0" y="159" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">rendu en deux minutes. Rien ne part sur</text><text x="0" y="184" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">internet : tout reste sur l&#x27;ordinateur.</text></svg>