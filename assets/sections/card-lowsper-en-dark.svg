<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 228" role="img" aria-label="Lowsper. Open source · runs in the browser. During a meeting, Lowsper writes down everything that is said and tells the speakers apart. I walk out with what I need to write the minutes in two minutes. Nothing goes online: everything stays on the computer."><title>Lowsper. Open source · runs in the browser. During a meeting, Lowsper writes down everything that is said and tells the speakers apart. I walk out with what I need to write the minutes in two minutes. Nothing goes online: everything stays on the computer.</title><style>@font-face{font-family:'Sora';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style><text x="0" y="26" font-family="Sora" font-size="22" font-weight="700" fill="#e6edf3">Lowsper</text><text x="0" y="50" font-family="JetBrains Mono" font-size="12.5" font-weight="400" fill="#9198a1">Open source · runs in the browser</text><text x="0" y="84" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">During a meeting, Lowsper writes down</text><text x="0" y="109" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">everything that is said and tells the</text><text x="0" y="134" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">speakers apart. I walk out with what I</text><text x="0" y="159" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">need to write the minutes in two</text><text x="0" y="184" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">minutes. Nothing goes online: everything</text><text x="0" y="209" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">stays on the computer.</text></svg>