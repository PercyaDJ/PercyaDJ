<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 380" role="img" aria-label="Photo lab: the photo is sorted by an AI, then edited, before and after"><title>Photo lab: the photo is sorted by an AI, then edited, before and after</title><style>@font-face{font-family:'Sora';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes scan{0%{transform:translateY(0)}60%,100%{transform:translateY(230px)}}
@keyframes rowIn{0%,30%{opacity:0;transform:translateX(-14px)}38%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes lineIn{0%{opacity:0;clip-path:inset(0 100% 0 0)}12%{opacity:1;clip-path:inset(0 0 0 0)}88%{opacity:1}100%{opacity:0}}
@keyframes thumb{0%,44%{opacity:0;transform:translateY(8px)}50%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes fall{0%{opacity:0;transform:translateY(-60px)}12%{opacity:1;transform:translateY(0)}40%{opacity:1;transform:translate(var(--dx),40px) scale(.4)}46%,100%{opacity:0;transform:translate(var(--dx),40px) scale(.4)}}
@keyframes fillIn{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes grow{0%,44%{transform:scaleX(0)}56%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes mail{0%,62%{opacity:0;transform:translate(0,0)}68%{opacity:1}86%{opacity:1;transform:translate(70px,-26px)}92%,100%{opacity:0;transform:translate(90px,-34px)}}
@keyframes split{0%,15%{transform:translateX(0)}45%,60%{transform:translateX(170px)}90%,100%{transform:translateX(0)}}
@keyframes tagIn{0%,20%{opacity:0;transform:translateY(6px)}28%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.scanbeam{animation:scan 6s cubic-bezier(.5,0,.5,1) infinite}
.row{opacity:0;animation:rowIn 6s infinite}
.wv{transform-box:fill-box;transform-origin:center;animation:wave 1.1s ease-in-out infinite}
.tl{opacity:0;animation:lineIn 9s infinite}
.th{opacity:0;animation:thumb 9s infinite}
.csv{opacity:0;animation:fall 7s cubic-bezier(.4,0,.3,1) infinite}
.fi{opacity:0;animation:fillIn 7s infinite}
.gr{transform-box:fill-box;transform-origin:left;animation:grow 7s infinite}
.ml{opacity:0;animation:mail 7s infinite}
.splitl{animation:split 8s ease-in-out infinite}
.tg{opacity:0;animation:tagIn 8s infinite}
.pu{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
 .scanbeam,.wv,.csv,.gr,.ml,.splitl,.pu{animation:none}
 .row,.tl,.th,.fi,.tg{animation:none;opacity:1}.csv,.ml{opacity:0}
}
</style><defs><clipPath id="c"><rect width="900" height="380" rx="16"/></clipPath></defs><g clip-path="url(#c)"><rect width="900" height="380" fill="#0f171a"/><defs><linearGradient id="ph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1430"/><stop offset="1" stop-color="#24366a"/></linearGradient><linearGradient id="au" x1="0" x2="1"><stop offset="0" stop-color="#43f5b5" stop-opacity="0"/><stop offset=".5" stop-color="#43f5b5"/><stop offset="1" stop-color="#a28bff" stop-opacity="0"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="9"/></filter><clipPath id="k"><rect x="40" y="62" width="480" height="280" rx="10"/></clipPath><clipPath id="r"><rect class="splitl" x="40" y="62" width="160" height="280"/></clipPath></defs><text x="40" y="44" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#9ab3b3">THE RAW PHOTO</text><text x="560" y="44" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#9ab3b3">AI SORTS, THE ENGINE EDITS</text><g clip-path="url(#k)"><g><rect x="40" y="62" width="480" height="280" fill="url(#ph)"/><path d="M40 170 C 160 110, 280 200, 400 140 S 520 120, 540 150 L 540 190 C 420 170, 300 240, 180 200 S 60 200, 40 220Z" fill="url(#au)" filter="url(#bl)"/><path d="M40 300 L140 250 L230 278 L330 236 L430 270 L520 246 L520 342 L40 342Z" fill="#050a14"/></g><g clip-path="url(#r)" style="filter:brightness(.55) saturate(.4)"><rect x="40" y="62" width="480" height="280" fill="url(#ph)"/><path d="M40 170 C 160 110, 280 200, 400 140 S 520 120, 540 150 L 540 190 C 420 170, 300 240, 180 200 S 60 200, 40 220Z" fill="url(#au)" filter="url(#bl)"/><path d="M40 300 L140 250 L230 278 L330 236 L430 270 L520 246 L520 342 L40 342Z" fill="#050a14"/></g><rect class="splitl" x="198" y="62" width="3" height="280" fill="#fff"/></g><g class="tg" style="animation-delay:0.0s"><rect x="560" y="70" width="300" height="40" rx="20" fill="#152125" stroke="#24373a"/><circle cx="584" cy="90" r="6" fill="#4fd1c5"/><text x="600" y="95" font-family="Sora" font-size="14" font-weight="600" fill="#e7f2f1">northern lights</text></g><g class="tg" style="animation-delay:0.5s"><rect x="560" y="122" width="300" height="40" rx="20" fill="#152125" stroke="#24373a"/><circle cx="584" cy="142" r="6" fill="#56d38a"/><text x="600" y="147" font-family="Sora" font-size="14" font-weight="600" fill="#e7f2f1">sharpness 94%</text></g><g class="tg" style="animation-delay:1.0s"><rect x="560" y="174" width="300" height="40" rx="20" fill="#152125" stroke="#24373a"/><circle cx="584" cy="194" r="6" fill="#f0b84a"/><text x="600" y="199" font-family="Sora" font-size="14" font-weight="600" fill="#e7f2f1">keep · 5 stars</text></g><g class="tg" style="animation-delay:1.5s"><rect x="560" y="226" width="300" height="40" rx="20" fill="#152125" stroke="#24373a"/><circle cx="584" cy="246" r="6" fill="#9b8cff"/><text x="600" y="251" font-family="Sora" font-size="14" font-weight="600" fill="#e7f2f1">video: timelapse ready</text></g><rect x="560" y="290" width="300" height="52" rx="12" fill="#152125" stroke="#4fd1c5"/><text x="580" y="313" font-family="JetBrains Mono" font-size="12" font-weight="600" fill="#4fd1c5">MCP server</text><text x="580" y="332" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#9ab3b3">local or external AI plugged in</text></g></svg>