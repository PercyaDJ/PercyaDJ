<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 228" role="img" aria-label="Lysbor. SaaS · open demo. When a team writes software, security flaws slip in. Lysbor reviews every new version, finds the flaws and says who must fix what, and by when. It also warns you when European law requires a problem to be reported."><title>Lysbor. SaaS · open demo. When a team writes software, security flaws slip in. Lysbor reviews every new version, finds the flaws and says who must fix what, and by when. It also warns you when European law requires a problem to be reported.</title><style>@font-face{font-family:'Sora';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style><text x="0" y="26" font-family="Sora" font-size="22" font-weight="700" fill="#e6edf3">Lysbor</text><text x="0" y="50" font-family="JetBrains Mono" font-size="12.5" font-weight="400" fill="#9198a1">SaaS · open demo</text><text x="0" y="84" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">When a team writes software, security</text><text x="0" y="109" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">flaws slip in. Lysbor reviews every new</text><text x="0" y="134" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">version, finds the flaws and says who</text><text x="0" y="159" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">must fix what, and by when. It also</text><text x="0" y="184" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">warns you when European law requires a</text><text x="0" y="209" font-family="Sora" font-size="15" font-weight="300" fill="#e6edf3">problem to be reported.</text></svg>