eight="600" fill="#e7f2f1">Mot de passe oublié dans le code</text><text x="520" y="218" font-family="JetBrains Mono" font-size="12.5" font-weight="400" fill="#9ab3b3">Équipe infra · aujourd&#x27;hui</text></g><g class="row" style="animation-delay:0.7s"><rect x="470" y="254" width="390" height="76" rx="12" fill="#152125" stroke="#24373a"/><circle cx="498" cy="292" r="8" fill="#f0b84a"/><text x="520" y="286" font-family="Sora" font-size="16" font-weight="600" fill="#e7f2f1">À déclarer (loi CRA)</text><text x="520" y="310" font-family="JetBrains Mono" font-size="12.5" font-weight="400" fill="#9ab3b3">Responsable sécurité · sous 24 h</text></g></g></svg>