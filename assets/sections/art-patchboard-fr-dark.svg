 font-weight="600" fill="#9ab3b3">CSV</text></g><g class="csv" style="--dx:198px;animation-delay:0.72s"><rect x="242" y="200" width="66" height="86" rx="8" fill="#152125" stroke="#24373a"/><text x="275" y="250" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#9ab3b3">CSV</text></g><g class="csv" style="--dx:102px;animation-delay:0.84s"><rect x="338" y="200" width="66" height="86" rx="8" fill="#152125" stroke="#24373a"/><text x="371" y="250" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#9ab3b3">CSV</text></g><g class="fi"><rect x="480" y="62" width="380" height="280" rx="12" fill="#152125" stroke="#24373a"/><text x="506" y="140" font-family="Sora" font-size="58" font-weight="800" fill="#ff7a66">18</text><text x="590" y="118" font-family="Sora" font-size="16" font-weight="600" fill="#e7f2f1">ordinateurs</text><text x="590" y="140" font-family="Sora" font-size="15" font-weight="400" fill="#9ab3b3">à mettre à jour</text></g><g class="fi"><text x="506" y="198" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#9ab3b3">Antivirus</text></g><rect class="gr" x="620" y="188" width="144.0" height="12" rx="6" fill="#56d38a"/><g class="fi"><text x="506" y="238" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#9ab3b3">Mises à jour</text></g><rect class="gr" x="620" y="228" width="96.0" height="12" rx="6" fill="#f0b84a"/><g class="fi"><text x="506" y="278" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#9ab3b3">Les deux</text></g><rect class="gr" x="620" y="268" width="44.0" height="12" rx="6" fill="#ff7a66"/><g class="ml"><rect x="770" y="292" width="44" height="30" rx="5" fill="#4fd1c5"/><path d="M770 294 l22 16 22 -16" fill="none" stroke="#152125" stroke-width="2.5"/></g></g></svg>