name: Now frame

# Moves the "now" frame of the profile panorama at 8:00, 10:00, 14:00, 18:00, 22:00 and midnight (French time).
# GitHub delays and drops scheduled runs, so the workflow checks every 15 minutes: a skipped run is caught
# by the next one. A run that finds the current slot already published exits without pushing anything,
# so the live branch still changes only six times a day.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: ["assets/live-src/**", "tools/update_live.sh", ".github/workflows/now-frame.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-frame
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the current frame to the live branch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bash tools/update_live.sh
          else
            bash tools/update_live.sh --force
          fi
